[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsearch-agent"
version = "0.1.0"
description = "Process-supervised deep search for survey-oriented literature retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Shuhao Chen", email = "csh24@mails.tsinghua.edu.cn"},
]
dependencies = []

[project.optional-dependencies]
api = ["requests>=2.31"]
data = ["datasets>=3.0", "pyarrow>=15.0"]
train = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "peft>=0.13",
  "torch>=2.4",
  "transformers>=4.45",
]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "peft>=0.13",
  "pyarrow>=15.0",
  "pytest>=8.0",
  "requests>=2.31",
  "ruff>=0.6",
  "torch>=2.4",
  "transformers>=4.45",
]

[project.scripts]
deepsearch-demo = "deepsearch.cli:demo_main"
deepsearch-construct = "deepsearch.cli:construct_main"
deepsearch-evaluate = "deepsearch.cli:evaluate_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/deepsearch/prompts" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
